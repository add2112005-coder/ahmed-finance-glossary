<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بحث المصطلحات | Ahmed Finance</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--orange:#e7772d;--paper:#f5f2eb;--card:#fffdf9;--ink:#171717;--muted:#6f6b63;--line:#ded8cc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Cairo,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.brand{font-weight:800;font-size:18px}.btn{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:10px 14px;cursor:pointer;text-decoration:none;color:inherit;font:inherit}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}.hero h1{margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.search{width:100%;padding:16px;border:1px solid var(--line);border-radius:13px;font:inherit;background:white;outline-color:var(--orange);margin:14px 0}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.result{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;cursor:pointer;text-align:right}.result:hover{border-color:var(--orange)}.en{font:700 18px Arial,sans-serif;direction:ltr;text-align:left;color:#171717}.ar{font-size:15px;font-weight:700;margin-top:8px}.tag{display:inline-block;background:#fff0e5;color:#a84e1c;border-radius:20px;padding:4px 9px;font-size:11px;margin-top:10px}.definition{line-height:2;margin-top:18px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.results{grid-template-columns:1fr}.hero,.card{padding:16px}}
/* Shared responsive site navigation */
.site-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;margin:0 auto 22px;max-width:1100px;background:#fffdf9;border:1px solid #ded8cc;border-radius:16px;position:relative;z-index:30}.site-brand{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none;color:#171717;white-space:nowrap}.site-brand img{width:38px;height:38px;object-fit:contain}.site-links{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.site-links a{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;border-radius:10px;text-decoration:none;color:#37332e;font:700 13px Cairo,Arial,sans-serif;border:1px solid transparent}.site-links a:hover,.site-links a.current{background:#fff0e5;color:#b84d13;border-color:#f3c6a7}.site-menu-btn{display:none;border:1px solid #ded8cc;border-radius:10px;background:white;padding:10px 13px;font-size:18px;cursor:pointer}.site-nav-backdrop{display:none}
@media(max-width:680px){.site-nav{margin:10px 10px 18px;padding:10px 12px}.site-menu-btn{display:block}.site-links{display:none;position:absolute;top:calc(100% + 8px);right:0;left:0;background:#fffdf9;border:1px solid #ded8cc;border-radius:14px;padding:10px;box-shadow:0 16px 40px #0002;flex-direction:column;align-items:stretch}.site-links.open{display:flex}.site-links a{justify-content:flex-start;padding:12px}.site-nav-backdrop.open{display:block;position:fixed;inset:0;background:#17171735;z-index:20}}
</style><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Ahmed Finance"><meta name="theme-color" content="#ffffff"></head><body><nav class="site-nav" aria-label="التنقل الرئيسي"><a class="site-brand" href="/" aria-label="Ahmed Finance الرئيسية"><img src="/ae-logo.png" alt=""><span>Ahmed Finance</span></a><button class="site-menu-btn" id="siteMenuBtn" aria-expanded="false" aria-controls="siteLinks" aria-label="فتح القائمة">☰</button><div class="site-links" id="siteLinks"><a href="/">الرئيسية</a><a href="/search">بحث المصطلحات</a><a href="/review">المراجعة الذكية</a><a href="/">مكتبة المصطلحات</a></div></nav><div class="site-nav-backdrop" id="siteNavBackdrop"></div><script>(function(){const b=document.getElementById('siteMenuBtn'),l=document.getElementById('siteLinks'),o=document.getElementById('siteNavBackdrop');if(!b||!l)return;function close(){l.classList.remove('open');o.classList.remove('open');b.setAttribute('aria-expanded','false')}b.addEventListener('click',()=>{const open=!l.classList.contains('open');l.classList.toggle('open',open);o.classList.toggle('open',open);b.setAttribute('aria-expanded',String(open))});o.addEventListener('click',close);l.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));const path=location.pathname; l.querySelectorAll('a').forEach(a=>{if(a.getAttribute('href')===path || (path==='/'&&a.getAttribute('href')==='/'))a.classList.add('current')})})();</script><main class="wrap"><section class="hero"><h1>ابحث عن مصطلح</h1><div class="muted">صفحة بحث مستقلة وسريعة — اكتب بالعربي أو الإنجليزي.</div><input class="search" id="q" placeholder="مثال: تكلفة / تكلفه / نظام الاوامر / Abnormal Spoilage" autofocus><div id="meta" class="muted">اكتب اسم المصطلح لعرض نتائج البحث.</div></section><div class="results" id="results"></div></main><script>let terms=[];const norm=v=>String(v||'').toLocaleLowerCase('ar').normalize('NFD').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}]+/gu,' ').trim().replace(/\s+/g,' ');const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){let q=norm(document.getElementById('q').value);const results=document.getElementById('results');if(!q){document.getElementById('meta').textContent=terms.length?'اكتب اسم المصطلح لعرض نتائج البحث.':'جاري تحميل المصطلحات…';results.innerHTML='';return}let list=terms.filter(t=>norm([t.en,t.ar,t.definition_en,t.definition_ar].join(' ')).includes(q)).slice(0,150);document.getElementById('meta').textContent=`${list.length} نتيجة${terms.length>150?' (أول 150 نتيجة)':''}`;results.innerHTML=list.map(t=>`<article class="result" onclick="location.href='term.html?id=${encodeURIComponent(t.id)}'"><div class="en">${esc(t.en)}</div><div class="ar">${esc(t.ar||'لا يوجد مقابل عربي')}</div><span class="tag">${esc(t.topic||'عام')}</span></article>`).join('')||'<div class="empty">مفيش نتائج. جرّب كتابة الكلمة من غير تشكيل أو جرّب المرادف.</div>'}document.getElementById('q').addEventListener('input',draw);fetch('/api/terms').then(r=>r.json()).then(d=>{terms=d.terms||[];draw()}).catch(()=>{document.getElementById('meta').textContent='تعذر تحميل المصطلحات. حدّث الصفحة أو ارجع للرئيسية.'});</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}</script></body></html>
