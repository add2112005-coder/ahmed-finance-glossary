<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بحث المصطلحات | Ahmed Finance</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--orange:#e7772d;--paper:#f5f2eb;--card:#fffdf9;--ink:#171717;--muted:#6f6b63;--line:#ded8cc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Cairo,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.brand{font-weight:800;font-size:18px}.btn{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:10px 14px;cursor:pointer;text-decoration:none;color:inherit;font:inherit}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}.hero h1{margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.search{width:100%;padding:16px;border:1px solid var(--line);border-radius:13px;font:inherit;background:white;outline-color:var(--orange);margin:14px 0}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.result{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;cursor:pointer;text-align:right}.result:hover{border-color:var(--orange)}.en{font:700 18px Arial,sans-serif;direction:ltr;text-align:left;color:#171717}.ar{font-size:15px;font-weight:700;margin-top:8px}.tag{display:inline-block;background:#fff0e5;color:#a84e1c;border-radius:20px;padding:4px 9px;font-size:11px;margin-top:10px}.definition{line-height:2;margin-top:18px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.results{grid-template-columns:1fr}.hero,.card{padding:16px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">Ahmed Finance · Glossary</div><a class="btn" href="/">الرئيسية</a></div><section class="hero"><h1>ابحث عن مصطلح</h1><div class="muted">صفحة بحث مستقلة وسريعة — اكتب بالعربي أو الإنجليزي.</div><input class="search" id="q" placeholder="مثال: تكلفة / تكلفه / نظام الاوامر / Abnormal Spoilage" autofocus><div id="meta" class="muted">اكتب اسم المصطلح لعرض نتائج البحث.</div></section><div class="results" id="results"></div></main><script>let terms=[];const norm=v=>String(v||'').toLocaleLowerCase('ar').normalize('NFD').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}]+/gu,' ').trim().replace(/\s+/g,' ');const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){let q=norm(document.getElementById('q').value);const results=document.getElementById('results');if(!q){document.getElementById('meta').textContent=terms.length?'اكتب اسم المصطلح لعرض نتائج البحث.':'جاري تحميل المصطلحات…';results.innerHTML='';return}let list=terms.filter(t=>norm([t.en,t.ar,t.definition_en,t.definition_ar].join(' ')).includes(q)).slice(0,150);document.getElementById('meta').textContent=`${list.length} نتيجة${terms.length>150?' (أول 150 نتيجة)':''}`;results.innerHTML=list.map(t=>`<article class="result" onclick="location.href='term.html?id=${encodeURIComponent(t.id)}'"><div class="en">${esc(t.en)}</div><div class="ar">${esc(t.ar||'لا يوجد مقابل عربي')}</div><span class="tag">${esc(t.topic||'عام')}</span></article>`).join('')||'<div class="empty">مفيش نتائج. جرّب كتابة الكلمة من غير تشكيل أو جرّب المرادف.</div>'}document.getElementById('q').addEventListener('input',draw);fetch('/api/terms').then(r=>r.json()).then(d=>{terms=d.terms||[];draw()}).catch(()=>{document.getElementById('meta').textContent='تعذر تحميل المصطلحات. حدّث الصفحة أو ارجع للرئيسية.'});</script></body></html>
