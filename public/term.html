<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المصطلح | Ahmed Finance</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--orange:#e7772d;--paper:#f5f2eb;--card:#fffdf9;--ink:#171717;--muted:#6f6b63;--line:#ded8cc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Cairo,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.brand{font-weight:800;font-size:18px}.btn{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:10px 14px;cursor:pointer;text-decoration:none;color:inherit;font:inherit}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}.hero h1{margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.search{width:100%;padding:16px;border:1px solid var(--line);border-radius:13px;font:inherit;background:white;outline-color:var(--orange);margin:14px 0}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.result{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;cursor:pointer;text-align:right}.result:hover{border-color:var(--orange)}.en{font:700 18px Arial,sans-serif;direction:ltr;text-align:left;color:#171717}.ar{font-size:15px;font-weight:700;margin-top:8px}.tag{display:inline-block;background:#fff0e5;color:#a84e1c;border-radius:20px;padding:4px 9px;font-size:11px;margin-top:10px}.definition{line-height:2;margin-top:18px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.primary{background:var(--orange);color:white;border:1px solid var(--orange);border-radius:11px;padding:11px 16px;cursor:pointer;font:700 14px Cairo,Arial,sans-serif}.status{font-size:13px;margin-top:12px;color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.results{grid-template-columns:1fr}.hero,.card{padding:16px}}
/* Ahmed Finance unified responsive header */
.top{position:sticky;top:0;z-index:100;min-height:76px;padding:12px 0;margin:0 0 24px;background:var(--paper);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);padding:5px 8px;min-width:0}
.brand-logo{width:48px;height:48px;object-fit:contain;flex-shrink:0;background:transparent}
.brand strong{display:block;font-size:15px;letter-spacing:.4px;line-height:1.35}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.2px;line-height:1.5;margin-top:3px}
.site-nav a{transition:background .18s,border-color .18s,transform .18s}
.site-nav a:active{transform:scale(.98)}
.menu-toggle{border:1px solid var(--line);box-shadow:0 4px 12px #17171708}
@media(min-width:651px){.menu-toggle{display:none!important}.site-nav{display:flex!important}}
/* Responsive shared navigation */
.site-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.site-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-decoration:none;font:700 13px Cairo,Arial,sans-serif;white-space:nowrap}
.site-nav a:hover,.site-nav a[aria-current="page"]{border-color:var(--orange);background:#fff0e5;color:#a84e1c}
.menu-toggle{display:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:44px;height:44px;font-size:24px;line-height:1;cursor:pointer;align-items:center;justify-content:center}
@media(max-width:650px){.wrap{padding-top:0}.top{position:sticky;top:0;align-items:center;gap:8px;margin-bottom:18px;padding:10px 0;background:var(--paper);}.brand{font-size:15px;max-width:calc(100% - 58px)}.menu-toggle{display:inline-flex;flex-shrink:0}.site-nav{display:none;position:absolute;z-index:50;top:calc(100% + 8px);right:0;left:0;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 35px #0002;grid-template-columns:1fr;gap:6px}.site-nav.open{display:grid}.site-nav a{width:100%;justify-content:flex-start;min-height:46px}.hero{gap:12px}.actions .btn,.hero .btn,.actions button,.searchbar button{min-height:44px}.btn,button{touch-action:manipulation}}
</style><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Ahmed Finance"><meta name="theme-color" content="#ffffff"></head><body><main class="wrap"><header class="top"><a class="brand" href="/" aria-label="Ahmed Finance - الرئيسية"><img src="/ae-logo.png" alt="" class="brand-logo"><span><strong>AHMED FINANCE</strong><small>ACCOUNTING GLOSSARY</small></span></a><button class="menu-toggle" type="button" aria-label="فتح القائمة" aria-expanded="false">☰</button><nav class="site-nav" aria-label="التنقل الرئيسي"><a href="/">الرئيسية</a><a href="/search.html" aria-current="page">بحث المصطلحات</a><a href="/review-dashboard.html">المراجعة الذكية</a></nav></header><section class="card" id="content"><div class="muted">جاري تحميل المصطلح…</div></section></main><script>const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');fetch('/api/terms').then(r=>r.json()).then(d=>{const t=(d.terms||[]).find(x=>String(x.id)===String(id));if(!t){document.getElementById('content').innerHTML='<div class="empty">المصطلح غير موجود.</div>';return}document.title=t.en+' | Ahmed Finance';document.getElementById('content').innerHTML=`<span class="tag">${esc(t.topic||'عام')}</span><h1 class="en" style="font-size:clamp(26px,5vw,40px);margin-top:18px">${esc(t.en)}</h1><div class="ar" style="font-size:23px">${esc(t.ar||'لا يوجد مقابل عربي')}</div><div class="definition"><h3>English definition</h3><div dir="ltr" style="text-align:left">${esc(t.definition_en||'No definition available.')}</div></div><div class="definition"><h3>التعريف بالعربية</h3><div>${esc(t.definition_ar||'لا يوجد تعريف عربي متاح.')}</div></div><div class="actions"><button class="primary" id="addReviewBtn" type="button">＋ أضف للمراجعة</button><a class="btn" href="/review-dashboard.html">افتح لوحة المراجعة</a><a class="btn" href="search.html">ابحث عن مصطلح آخر</a></div><div id="saveStatus" class="status" role="status"></div>`;document.getElementById('addReviewBtn').addEventListener('click',async()=>{const btn=document.getElementById('addReviewBtn'),status=document.getElementById('saveStatus');btn.disabled=true;status.textContent='جارٍ حفظ المصطلح…';try{const me=await fetch('/api/auth/me',{credentials:'same-origin'});const md=await me.json();if(!me.ok||!md.user){status.innerHTML='لازم تسجّل الدخول الأول. <a href="/">ارجع للرئيسية وسجّل الدخول، وبعدها افتح المصطلح تاني.</a>';return}const r=await fetch('/api/reviews/save',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({term_id:t.id})});const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر حفظ المصطلح');btn.textContent='✓ محفوظ في المراجعة';status.innerHTML='تمت إضافة المصطلح لحسابك. <a href="/review-dashboard.html">ابدأ المراجعة من هنا.</a>'}catch(e){status.textContent=e.message||'حصل خطأ أثناء الحفظ.'}finally{btn.disabled=false}})}).catch(()=>document.getElementById('content').innerHTML='<div class="empty">تعذر تحميل بيانات المصطلح.</div>');</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}</script><script>(function(){const nav=document.querySelector('.site-nav');const toggle=document.querySelector('.menu-toggle');if(!nav||!toggle)return;toggle.addEventListener('click',()=>{const open=nav.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'إغلاق القائمة':'فتح القائمة');toggle.textContent=open?'×':'☰'});document.addEventListener('click',e=>{if(!nav.contains(e.target)&&!toggle.contains(e.target)){nav.classList.remove('open');toggle.setAttribute('aria-expanded','false');toggle.textContent='☰'}});nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{nav.classList.remove('open');toggle.setAttribute('aria-expanded','false');toggle.textContent='☰'}));})();</script></body></html>
