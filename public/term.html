<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المصطلح | Ahmed Finance</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--orange:#e7772d;--paper:#f5f2eb;--card:#fffdf9;--ink:#171717;--muted:#6f6b63;--line:#ded8cc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Cairo,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.brand{font-weight:800;font-size:18px}.btn{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:10px 14px;cursor:pointer;text-decoration:none;color:inherit;font:inherit}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}.hero h1{margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.search{width:100%;padding:16px;border:1px solid var(--line);border-radius:13px;font:inherit;background:white;outline-color:var(--orange);margin:14px 0}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.result{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;cursor:pointer;text-align:right}.result:hover{border-color:var(--orange)}.en{font:700 18px Arial,sans-serif;direction:ltr;text-align:left;color:#171717}.ar{font-size:15px;font-weight:700;margin-top:8px}.tag{display:inline-block;background:#fff0e5;color:#a84e1c;border-radius:20px;padding:4px 9px;font-size:11px;margin-top:10px}.definition{line-height:2;margin-top:18px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.results{grid-template-columns:1fr}.hero,.card{padding:16px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">Ahmed Finance · Glossary</div><a class="btn" href="search.html">← العودة للبحث</a></div><section class="card" id="content"><div class="muted">جاري تحميل المصطلح…</div></section></main><script>const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');fetch('/api/terms').then(r=>r.json()).then(d=>{const t=(d.terms||[]).find(x=>String(x.id)===String(id));if(!t){document.getElementById('content').innerHTML='<div class="empty">المصطلح غير موجود.</div>';return}document.title=t.en+' | Ahmed Finance';document.getElementById('content').innerHTML=`<span class="tag">${esc(t.topic||'عام')}</span><h1 class="en" style="font-size:clamp(26px,5vw,40px);margin-top:18px">${esc(t.en)}</h1><div class="ar" style="font-size:23px">${esc(t.ar||'لا يوجد مقابل عربي')}</div><div class="definition"><h3>English definition</h3><div dir="ltr" style="text-align:left">${esc(t.definition_en||'No definition available.')}</div></div><div class="definition"><h3>التعريف بالعربية</h3><div>${esc(t.definition_ar||'لا يوجد تعريف عربي متاح.')}</div></div><a class="btn" style="display:inline-block;margin-top:22px" href="search.html">ابحث عن مصطلح آخر</a>`}).catch(()=>document.getElementById('content').innerHTML='<div class="empty">تعذر تحميل بيانات المصطلح.</div>');</script></body></html>
